name: tracker hunter

on:
  schedule:
    # Runs every 6 hours (adjust as needed)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to manually click "Run workflow"

permissions:
  contents: write # CRITICAL: This allows the bot to push trackers.txt back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Hard limit for GitHub Actions is 6 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py
